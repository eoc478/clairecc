    <!-- used this code as reference https://www.w3schools.com/howto/howto_js_rangeslider.asp -->
    <div class="quizcontainer"> 


        <div class="q1">
            <p>how stressed are you feeling right now?</p>
            <input type="range" min="1" max="100" value="50" class="slider" id="myRange">
            <div id="value"></div>
        </div>

        <div class="q2">
            <p>how many absences have you taken for this class?</p>
    <!-- why do they name it radio??? spent so long trying to find this option -->
    <!-- name to make it so that you can only select one, id for styling -->
            <input type="radio" class="multi" name="absent" value="5">
            <label>< 3</label>
            <input type="radio" class="multi" name="absent" value="10">
            <label>> 3</label>
        </div>

        <div class="q3">
            <p>what is your screen time?</p>
            <input type="radio" class="multi" name="screen" value="5">
            <label>< 2 hours</label>
            <input type="radio" class="multi" name="screen" value="10">
            <label>3-6 hours</label>
            <input type="radio" class="multi" name="screen" value="15">
            <label>7-12 hours</label>
            <input type="radio" class="multi" name="screen" value="20">
